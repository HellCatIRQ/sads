<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>منصة السادس</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      direction: rtl;
      margin: 0;
    }
    /* ⭐ شاشة كلمة المرور */
    #login-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #121212; z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
    }
    #login-box {
        background-color: #1e1e1e; padding: 30px; border-radius: 10px;
        text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    #login-box input {
        padding: 12px; font-size: 16px; width: 250px;
        border: 1px solid #444; border-radius: 5px;
        background-color: #333; color: white;
    }
    #login-box button {
        padding: 12px 20px; font-size: 16px; margin-top: 15px;
        border: none; border-radius: 5px; background-color: #007bff;
        color: white; cursor: pointer;
    }
    .hidden { display: none; }
    
    /* باقي الأنماط */
    .page { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .page.active { display: block; }
    h1, h2 { color: #ffffff; text-align: center; }
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .card {
      background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px;
      text-align: center; cursor: pointer; transition: all 0.3s ease;
    }
    .card:hover { background-color: #007bff; color: white; transform: translateY(-5px); }
    .video-container {
      max-width: 960px; margin: 20px auto; background-color: #1e1e1e;
      border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .video-js { border-radius: 8px; overflow: hidden; }
    .back-button {
        display: block; width: fit-content; margin: 20px auto 0; padding: 10px 25px;
        border: none; border-radius: 5px; background-color: #007bff; color: white;
        cursor: pointer; transition: background-color 0.3s ease;
    }
    .back-button:hover { background-color: #0056b3; }
    .vjs-control-bar { background-color: rgba(28, 28, 28, 0.85) !important; }
    .manual-menu-button {
        position: relative; cursor: pointer; width: 5em; height: 100%;
        display: flex; align-items: center; justify-content: center; font-size: 1.1em;
    }
    .manual-menu {
        display: none; position: absolute; bottom: 100%; left: 0; right: 0;
        margin: 0 auto 10px; background-color: rgba(28, 28, 28, 0.95);
        color: white; list-style: none; padding: 5px 0; border-radius: 5px;
        min-width: 80px; text-align: center;
    }
    .manual-menu-button:hover .manual-menu { display: block; }
    .manual-menu-item { padding: 8px 12px; }
    .manual-menu-item:hover { background-color: #007bff !important; }
  </style>
</head>
<body>
  
  <div id="login-overlay">
    <div id="login-box">
      <h2>الرجاء إدخال كلمة المرور</h2>
      <input type="password" id="passwordInput" placeholder="كلمة المرور">
      <br>
      <button id="loginBtn">دخول</button>
      <p id="loginError" style="color:red; display:none;">كلمة المرور غير صحيحة</p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <div id="mainPage" class="page"><h1 >منصة السادس</h1><div class="card-grid" id="teachers"></div></div>
    <div id="teacherPage" class="page"><h2 id="teacherName"></h2><div class="card-grid" id="classes"></div><button class="back-button">العودة للرئيسية</button></div>
    <div id="classPage" class="page"><h2 id="className"></h2><div class="card-grid" id="lectures"></div><button class="back-button">العودة للمدرس</button></div>
    <div id="videoPage" class="page">
      <div class="video-container">
        <video id="videoPlayer" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
        <h2 id="videoTitle"></h2><p id="videoDescription"></p>
        <button class="back-button">العودة للفصل</button>
      </div>
    </div>
  </div>

  <script>
    let data, currentTeacher, currentClass, currentLecture, player;
    let availableQualities = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loginBtn').addEventListener('click', attemptLogin);
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
    });

    async function attemptLogin() {
        const password = document.getElementById('passwordInput').value;
        const loginError = document.getElementById('loginError');
        if (!password) return;

        try {
            const response = await fetch('data.txt'); // ⭐ جلب الملف المشفر
            if (!response.ok) throw new Error("File not found");
            const encryptedData = await response.text();

            // ⭐ محاولة فك التشفير
            const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, password);
            const decryptedJson = decryptedBytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedJson) throw new Error("Wrong password");
            
            data = JSON.parse(decryptedJson); // إذا نجح التحويل، فكلمة المرور صحيحة
            
            // ⭐ إخفاء شاشة الدخول وبدء التطبيق
            const loginOverlay = document.getElementById('login-overlay');
            loginOverlay.style.opacity = '0';
            setTimeout(() => loginOverlay.style.display = 'none', 500);
            
            document.getElementById('app-content').classList.remove('hidden');
            initializeApp();

        } catch (err) {
            console.error("Login Error:", err);
            loginError.style.display = 'block'; // إظهار رسالة الخطأ
        }
    }
    
    // باقي الكود يبقى كما هو تقريباً
    function initializeApp() { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function setupEventListeners() { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function navigate(page) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function createCard(text) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function showTeachers() { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function showClasses(t) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function showLectures(cls) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function initializePlayer() { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function showVideo(lec) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function updateAvailableQualities(url) { /* ... (نفس الكود من الإصدار السابق) ... */ }
    function setupKeyboardShortcuts() { /* ... (نفس الكود من الإصدار السابق) ... */ }

    // النسخ الكامل للوظائف السابقة هنا
    function initializeApp(){initializePlayer();setupEventListeners();setupKeyboardShortcuts();navigate('main')}
    function setupEventListeners(){document.querySelector('#teacherPage .back-button').onclick=()=>navigate('main');document.querySelector('#classPage .back-button').onclick=()=>navigate('teacher');document.querySelector('#videoPage .back-button').onclick=()=>navigate('class')}
    function navigate(e){document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));document.getElementById(e+"Page").classList.add("active");"video"!==e&&player&&!player.isDisposed()&&player.pause();switch(e){case"main":showTeachers();break;case"teacher":currentTeacher&&showClasses(currentTeacher);break;case"class":currentClass&&showLectures(currentClass);break;case"video":currentLecture&&showVideo(currentLecture)}}
    function createCard(e){const t=document.createElement("div");return t.className="card",t.textContent=e,t}
    function showTeachers(){const e=document.getElementById("teachers");e.innerHTML="",data.teachers.forEach(t=>{const n=createCard(t.name);n.onclick=()=>{currentTeacher=t,navigate("teacher")},e.appendChild(n)})}
    function showClasses(e){document.getElementById("teacherName").textContent=e.name;const t=document.getElementById("classes");t.innerHTML="",e.classes.forEach(n=>{const o=createCard(n.name);o.onclick=()=>{currentClass=n,navigate("class")},t.appendChild(o)})}
    function showLectures(e){document.getElementById("className").textContent=e.name;const t=document.getElementById("lectures");t.innerHTML="",e.lectures.forEach(n=>{const o=createCard(n.title);o.onclick=()=>{currentLecture=n,navigate("video")},t.appendChild(o)})}
    function initializePlayer(){player=videojs("videoPlayer",{controls:!0,fluid:!0});player.ready(()=>{const e=player.controlBar.el(),t=player.controlBar.fullscreenToggle.el(),n=document.createElement("div");n.className="manual-menu-button";const o=document.createElement("span");o.textContent="1.0x";const a=document.createElement("ul");a.className="manual-menu";[0.25,0.5,0.75,1,1.25,1.5,1.75,2].forEach(e=>{const t=document.createElement("li");t.className="manual-menu-item",t.textContent=`${e}x`,t.onclick=t=>{t.stopPropagation(),player.playbackRate(e)},a.appendChild(t)});n.appendChild(o),n.appendChild(a),e.insertBefore(n,t),player.on("ratechange",()=>{o.textContent=`${player.playbackRate()}x`});const r=document.createElement("div");r.className="manual-menu-button",r.innerHTML="<span>⚙️</span>";const c=document.createElement("ul");c.className="manual-menu",r.appendChild(c),e.insertBefore(r,t),player.on("loadstart",()=>{c.innerHTML="",availableQualities.forEach(e=>{const t=document.createElement("li");t.className="manual-menu-item",t.textContent=e.label,t.onclick=t=>{t.stopPropagation();const n=player.currentTime(),o=player.paused();player.src({src:e.url,type:e.type}),player.one("loadedmetadata",()=>{player.currentTime(n),o||player.play()})},c.appendChild(t)})})})}
    function showVideo(e){document.getElementById("videoTitle").textContent=e.title,document.getElementById("videoDescription").textContent=e.description||"",updateAvailableQualities(e.url);const t=availableQualities.find(e=>e.isInitial)||availableQualities[0];player.src({src:t.url,type:t.type}),player.playbackRate(1)}
    function updateAvailableQualities(e){availableQualities=[];const t=/_(\d{3,4}p)\.mp4$/,n=/media-(\d+)\/stream\.m3u8$/;if(t.test(e)){const n=e.replace(t,""),o=e.match(t)[1];let a=[];"1080p"===o?a=["1080p","720p","360p"]:"720p"===o?a=["720p","360p"]:a=["360p"],a.forEach(t=>{availableQualities.push({label:t,url:`${n}_${t}.mp4`,type:"video/mp4",isInitial:t===o})})}else if(n.test(e)){const t=parseInt(e.match(n)[1]),o=e.replace(/media-\d+\/stream\.m3u8$/,"");for(let e=1;e<=5;e++)availableQualities.push({label:`الجودة ${e}`,url:`${o}media-${e}/stream.m3u8`,type:"application/x-mpegURL",isInitial:e===t})}else availableQualities.push({label:"Auto",url:e,type:e.endsWith(".m3u8")?"application/x-mpegURL":"video/mp4",isInitial:!0})}
    function setupKeyboardShortcuts(){document.addEventListener("keydown",e=>{if(!document.getElementById("videoPage").classList.contains("active"))return;const t=document.activeElement;if(["INPUT","SELECT","BUTTON"].includes(t.tagName)||t.isContentEditable)return;switch(e.key.toLowerCase()){case" ":e.preventDefault(),player.paused()?player.play():player.pause();break;case"d":case"arrowright":e.preventDefault(),player.currentTime(player.currentTime()+10);break;case"a":case"arrowleft":e.preventDefault(),player.currentTime(player.currentTime()-10)}})}
  </script>
</body>
</html>
