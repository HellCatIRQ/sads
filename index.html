<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>منصة السادس - فيديوهات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <style>
    body {
      font-family: Tahoma, Arial;
      background: #181a1b;
      color: #fff;
      direction: rtl;
      margin: 0;
      padding: 0;
    }
    .page { display: none; padding: 20px; }
    .page.active { display: block; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: #202324;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .video-container {
      max-width: 900px;
      margin: auto;
    }
    .video-js {
      border-radius: 10px;
      width: 100% !important;
      height: auto !important;
    }
    button {
      padding: 10px 15px;
      margin-top: 15px;
      border: none;
      border-radius: 5px;
      background: #444;
      color: white;
      cursor: pointer;
      user-select: none;
    }
    #teacherImage {
      max-width: 150px;
      max-height: 150px;
      border-radius: 50%;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      border: 2px solid #666;
    }
    #qualitySelect, #speedSelect {
      margin: 10px 10px 20px 0;
      padding: 5px 10px;
      border-radius: 5px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
      user-select: none;
    }
    .controls-row {
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div id="mainPage" class="page active">
    <h1>منصة السادس</h1>
    <div class="card-grid" id="teachers"></div>
  </div>

  <div id="teacherPage" class="page">
    <h2 id="teacherName"></h2>
    <img id="teacherImage" src="" alt="صورة المدرس" />
    <div class="card-grid" id="classes"></div>
    <button onclick="navigate('main')">العودة للرئيسية</button>
  </div>

  <div id="classPage" class="page">
    <h2 id="className"></h2>
    <div class="card-grid" id="lectures"></div>
    <button onclick="navigate('teacher')">العودة للمدرس</button>
  </div>

  <div id="videoPage" class="page">
    <div class="video-container">
      <video
        id="videoPlayer"
        class="video-js vjs-default-skin"
        controls
        playsinline
        webkit-playsinline
        data-setup='{"fluid": true}'
      ></video>

      <div class="controls-row">
        <label for="qualitySelect">الجودة:</label>
        <select id="qualitySelect"></select>

        <label for="speedSelect">السرعة:</label>
        <select id="speedSelect">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>

      <h2 id="videoTitle"></h2>
      <p id="videoDescription"></p>
      <button onclick="navigate('class')">العودة للفصل</button>
    </div>
  </div>

  <script>
    // ملف data.json الموجود عندك
  let data = null;

fetch('data.json')
  .then(response => {
    if (!response.ok) throw new Error("فشل تحميل بيانات JSON");
    return response.json();
  })
  .then(json => {
    data = json;
    navigate("main");
  })
  .catch(err => {
    alert("حدث خطأ أثناء تحميل بيانات المحاضرات: " + err.message);
  });


    let currentTeacher = null;
    let currentClass = null;
    let currentLecture = null;

    // إنشاء مشغل الفيديو
    const player = videojs("videoPlayer");

    function navigate(page) {
      // توقف الفيديو إذا ننتقل من صفحة الفيديو
      if (document.getElementById("videoPage").classList.contains("active")) {
        player.pause();
      }
      
      // إخفاء كل الصفحات
      document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
      // إظهار الصفحة المطلوبة
      document.getElementById(page + "Page").classList.add("active");

      // تحديث المحتوى حسب الصفحة
      if (page === "main") showTeachers();
      else if (page === "teacher" && currentTeacher) showClasses(currentTeacher);
      else if (page === "class" && currentClass) showLectures(currentClass);
      else if (page === "video" && currentLecture) showVideo(currentLecture);
    }

    // عرض المدرسين
    function showTeachers() {
      const container = document.getElementById("teachers");
      container.innerHTML = "";
      data.teachers.forEach((teacher) => {
        const div = document.createElement("div");
        div.className = "card";
        div.textContent = teacher.name;
        div.onclick = () => {
          currentTeacher = teacher;
          navigate("teacher");
        };
        container.appendChild(div);
      });
    }

    // عرض الفصول للمدرس
    function showClasses(teacher) {
      const container = document.getElementById("classes");
      container.innerHTML = "";
      document.getElementById("teacherName").textContent = teacher.name;
      document.getElementById("teacherImage").src = teacher.image || "";
      teacher.classes.forEach((cls) => {
        const div = document.createElement("div");
        div.className = "card";
        div.textContent = cls.name;
        div.onclick = () => {
          currentClass = cls;
          navigate("class");
        };
        container.appendChild(div);
      });
    }

    // عرض المحاضرات للفصل
    function showLectures(cls) {
      const container = document.getElementById("lectures");
      container.innerHTML = "";
      document.getElementById("className").textContent = cls.name;
      cls.lectures.forEach((lec) => {
        const div = document.createElement("div");
        div.className = "card";
        div.textContent = lec.title;
        div.onclick = () => {
          currentLecture = lec;
          navigate("video");
        };
        container.appendChild(div);
      });
    }

    // متغير يخزن جودات الفيديو المتاحة
    let availableQualities = [];

    function extractBaseUrl(url) {
      // حذف الجودة من الرابط (مثال _720p.mp4 إلى فقط الرابط بدون الجودة)
      return url.replace(/_(1080p|720p|360p)\.mp4$/, "");
    }

    // عرض الفيديو مع الجودة والسرعة والتحكمات
    function showVideo(lec) {
      document.getElementById("videoTitle").textContent = lec.title;
      document.getElementById("videoDescription").textContent = lec.description || "";

      availableQualities = [];

      if (lec.url.endsWith(".mp4")) {
        // نجرب نعرف القيم اللي موجودة في الرابط (1080p, 720p, 360p)
        const baseUrl = extractBaseUrl(lec.url);

        if (lec.url.includes("_1080p.mp4")) {
          // الفيديو أصله 1080، ندعم 1080 و 720 و 360
          availableQualities.push({ label: "1080p", url: baseUrl + "_1080p.mp4", type: "video/mp4" });
          availableQualities.push({ label: "720p", url: baseUrl + "_720p.mp4", type: "video/mp4" });
          availableQualities.push({ label: "360p", url: baseUrl + "_360p.mp4", type: "video/mp4" });
        } else if (lec.url.includes("_720p.mp4")) {
          // أصله 720، ندعم 720 و 360 فقط
          availableQualities.push({ label: "720p", url: baseUrl + "_720p.mp4", type: "video/mp4" });
          availableQualities.push({ label: "360p", url: baseUrl + "_360p.mp4", type: "video/mp4" });
        } else if (lec.url.includes("_360p.mp4")) {
          // أصله 360 فقط
          availableQualities.push({ label: "360p", url: baseUrl + "_360p.mp4", type: "video/mp4" });
        } else {
          // رابط عادي mp4 بدون جودة معرفة
          availableQualities.push({ label: "Video", url: lec.url, type: "video/mp4" });
        }
      } else if (lec.url.endsWith(".m3u8")) {
        // m3u8 لا ندعم تغيير جودة، نعرضه فقط جودة auto
        availableQualities.push({ label: "Auto (m3u8)", url: lec.url, type: "application/x-mpegURL" });
      } else {
        // رابط غير معروف نعرضه كما هو
        availableQualities.push({ label: "Video", url: lec.url, type: "video/mp4" });
      }

      // إعداد قائمة اختيار الجودة
      const qualitySelect = document.getElementById("qualitySelect");
      qualitySelect.innerHTML = "";
      availableQualities.forEach((q, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = q.label;
        qualitySelect.appendChild(option);
      });

      // نوقف الفيديو الحالي
      player.pause();

      // تحميل أول جودة افتراضياً
      player.src({ src: availableQualities[0].url, type: availableQualities[0].type });
      player.load();
      player.play();

      qualitySelect.value = 0;

      qualitySelect.onchange = () => {
        const q = availableQualities[qualitySelect.value];
        player.pause();
        player.src({ src: q.url, type: q.type });
        player.load();
        player.play();
      };

      // سرعة التشغيل
      const speedSelect = document.getElementById("speedSelect");
      speedSelect.value = "1";
      speedSelect.onchange = () => {
        player.playbackRate(speedSelect.value);
      };

      // تهيئة اختصارات لوحة المفاتيح
      setupKeyboardShortcuts();
    }

    // اختصارات لوحة المفاتيح: مسافة للتشغيل/إيقاف، A/D & أسهم للتقديم/التأخير 10 ثواني
    function setupKeyboardShortcuts() {
      document.onkeydown = function (e) {
        if (document.getElementById("videoPage").classList.contains("active")) {
          if (e.target.tagName.toLowerCase() === "input" || e.target.tagName.toLowerCase() === "select" || e.target.isContentEditable) return;

          switch (e.key.toLowerCase()) {
            case " ":
              e.preventDefault();
              if (player.paused()) player.play();
              else player.pause();
              break;
            case "a":
            case "arrowleft":
              e.preventDefault();
              player.currentTime(Math.max(0, player.currentTime() - 10));
              break;
            case "d":
            case "arrowright":
              e.preventDefault();
              player.currentTime(Math.min(player.duration(), player.currentTime() + 10));
              break;
          }
        }
      };
    }

    // بدء التطبيق بصفحة المدرسين
    navigate("main");
  </script>
</body>
</html>
