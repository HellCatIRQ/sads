<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>A3SaT Instagram:@jz.pd</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #181a1b;
  --fg: #fff;
  --box: #23272b;
  --accent: #4f8cff;
  --border: #333;
}
body {
  font-family: Tahoma, Arial; background: var(--bg); color: var(--fg); direction: rtl; margin:0; min-height:100vh;
}
header {background:var(--box);padding:16px 0;text-align:center;box-shadow:0 2px 8px #0002;}
.box { background: var(--box); border-radius: 10px; box-shadow: 0 2px 8px #0004; padding: 20px; margin: 30px auto; max-width: 600px; }
select, button { font-size: 1em; padding: 8px 16px; margin: 10px 0; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--fg); }
button { cursor:pointer; background:var(--accent); color:#fff; border:none; }
button:hover { background:#2563eb; }
.back-btn {margin-bottom:20px;}
.dark-toggle {position:fixed;top:10px;left:10px;z-index:10;}
.class, .lecture { margin: 20px 0; }
.lecture-btn {display:block;width:100%;text-align:right;}
video { width: 100%; max-width: 100%; margin-top: 10px; background:#000; border-radius:10px; }
.quality-btns button {margin-left:8px;}
.controls {display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
@media (max-width:700px){.box{margin:10px 2px;padding:10px;}}
</style>
</head>
<body>
<button class="dark-toggle" onclick="toggleDark()">🌙/☀️</button>
<header><h1>منصة السادس - الفيديوهات</h1></header>
<div id="app"></div>
<script>
let teachersData = [];
let state = {page:'teachers', teacher:null, classIdx:null, lectureIdx:null};
fetch('data.json').then(r=>r.json()).then(data=>{teachersData=data.teachers;render();});
function render(){
  const app=document.getElementById('app');
  if(state.page==='teachers'){
    app.innerHTML = `<div class='box'><h2>اختر المدرس</h2><div style='display:flex;flex-wrap:wrap;gap:16px;justify-content:center;'>${teachersData.map((t,i)=>`<div onclick='selectTeacher(${i})' style='cursor:pointer;text-align:center;background:var(--box);border-radius:10px;padding:12px 8px;width:120px;box-shadow:0 2px 8px #0002;transition:.2s;border:2px solid var(--accent);'><img src='${t.image}' alt='${t.name}' style='width:70px;height:70px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);'><div style='margin-top:8px;font-weight:bold;color:var(--accent);'>${t.name}</div><div style='font-size:13px;color:#aaa;'>${t.subject||''}</div></div>`).join('')}</div></div>`;
  }else if(state.page==='classes'){
    const t=teachersData[state.teacher];
    app.innerHTML = `<div class='box'><button class='back-btn' onclick='backToTeachers()'>⬅ رجوع</button><img src='${t.image}' alt='${t.name}' style='width:80px;border-radius:50%'><h2>${t.name}</h2><p>${t.subject}</p><h3>اختر الفصل</h3><select id='classSel'><option value=''>-- اختر الفصل --</option>${t.classes.map((c,i)=>`<option value='${i}'>${c.name}</option>`).join('')}</select></div>`;
    document.getElementById('classSel').onchange=e=>{if(e.target.value!==''){state.classIdx=+e.target.value;state.page='lectures';render();}};
  }else if(state.page==='lectures'){
    const t=teachersData[state.teacher], c=t.classes[state.classIdx];
    app.innerHTML = `<div class='box'><button class='back-btn' onclick='backToClasses()'>⬅ رجوع</button><h2>${t.name}</h2><h3>${c.name}</h3><h4>اختر المحاضرة</h4>${c.lectures.map((l,i)=>`<button class='lecture-btn' onclick='selectLecture(${i})'>${l.title} - ${l.description}</button>`).join('')}</div>`;
  }else if(state.page==='player'){
    const t=teachersData[state.teacher], c=t.classes[state.classIdx], l=c.lectures[state.lectureIdx];
    let qualities = getQualities(l.url);
    let qBtns = qualities.map(q=>`<button onclick='changeQuality("${q.url}")' ${q.selected?'style="background:#2563eb"':''}>${q.label}</button>`).join('');
    app.innerHTML = `<div class='box'><button class='back-btn' onclick='backToLectures()'>⬅ رجوع</button><h2>${t.name}</h2><h3>${c.name}</h3><h4>${l.title}</h4><div class='quality-btns'>${qBtns}</div><div id='playerWrap'></div></div>`;
    renderCustomPlayer(qualities.find(q=>q.selected).url);
  }
}
function selectTeacher(i){state.teacher=i;state.page='classes';render();}
function backToTeachers(){state.page='teachers';state.teacher=null;render();}
function backToClasses(){state.page='classes';state.classIdx=null;render();}
function backToLectures(){state.page='lectures';state.lectureIdx=null;render();}
function selectLecture(i){state.lectureIdx=i;state.page='player';render();}
function getQualities(url){
  let base=url.replace(/(_360p|_720p|_1080p)?\.mp4$/,'');
  let arr=[];
  if(url.includes('_1080p')){
    arr=[{label:'1080',url:base+'_1080p.mp4',selected:true},{label:'720',url:base+'_720p.mp4'},{label:'360',url:base+'_360p.mp4'}];
  }else if(url.includes('_720p')){
    arr=[{label:'720',url:base+'_720p.mp4',selected:true},{label:'360',url:base+'_360p.mp4'}];
  }else if(url.includes('_360p')){
    arr=[{label:'360',url:base+'_360p.mp4',selected:true}];
  }else{
    arr=[{label:'الرئيسية',url:url,selected:true}];
  }
  return arr;
}
function changeQuality(u){
  renderCustomPlayer(u,true);
}
function renderCustomPlayer(url,autoplay){
  const wrap=document.getElementById('playerWrap');
  wrap.innerHTML = `<video id='vid' src='${url}' style='width:100%;background:#000;border-radius:10px;display:block;' ${autoplay!==false?'autoplay':''} tabindex='0'></video>
    <div class='controls' style='justify-content:center;gap:12px;'>
      <button onclick='seek(-10)' title='⏪'>⏪ -10ث</button>
      <button onclick='togglePlay()' id='playBtn'>⏸️</button>
      <button onclick='seek(10)' title='+10ث'>+10ث ⏩</button>
      <button onclick='setSpeed(1)'>x1</button>
      <button onclick='setSpeed(1.5)'>x1.5</button>
      <button onclick='setSpeed(2)'>x2</button>
      <button onclick='toggleFullscreen()'>⛶</button>
    </div>`;
  setupPlayer();
}
function seek(sec){const v=document.getElementById('vid');v.currentTime+=sec;}
function setSpeed(s){const v=document.getElementById('vid');v.playbackRate=s;}
function togglePlay(){const v=document.getElementById('vid');if(v.paused){v.play();document.getElementById('playBtn').innerText='⏸️';}else{v.pause();document.getElementById('playBtn').innerText='▶️';}}
function toggleFullscreen(){const v=document.getElementById('vid');if(v.requestFullscreen){v.requestFullscreen();}}
function setupPlayer(){
  const v=document.getElementById('vid');
  v.focus();
  v.controls=false;
  v.addEventListener('play',()=>{document.getElementById('playBtn').innerText='⏸️';});
  v.addEventListener('pause',()=>{document.getElementById('playBtn').innerText='▶️';});
  v.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();togglePlay();}
    if(e.code==='ArrowRight'){seek(10);}
    if(e.code==='ArrowLeft'){seek(-10);}
  });
  v.addEventListener('touchstart',handleTouchStart,false);
  v.addEventListener('touchend',handleTouchEnd,false);
  let x0=null;
  function handleTouchStart(e){x0=e.changedTouches[0].clientX;}
  function handleTouchEnd(e){
    let x1=e.changedTouches[0].clientX;
    if(x0!==null){
      if(x1-x0>50)seek(-10);
      else if(x1-x0<-50)seek(10);
    }
    x0=null;
  }
}
function toggleDark(){
  if(document.body.style.background==="var(--bg)"){
    document.body.style.background="#fff";document.body.style.color="#000";
  }else{
    document.body.style.background="var(--bg)";document.body.style.color="var(--fg)";
  }
}
</script>

</body>
</html>
