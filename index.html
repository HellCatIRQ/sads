<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>منصة اعست</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      direction: rtl;
      margin: 0;
    }
    #login-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #121212; z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
    }
    #login-box {
        background-color: #1e1e1e; padding: 30px; border-radius: 10px;
        text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    #login-box input {
        padding: 12px; font-size: 16px; width: 250px;
        border: 1px solid #444; border-radius: 5px;
        background-color: #333; color: white;
    }
    #login-box button {
        padding: 12px 20px; font-size: 16px; margin-top: 15px;
        border: none; border-radius: 5px; background-color: #007bff;
        color: white; cursor: pointer;
    }
    .hidden { display: none; }
    .page { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .page.active { display: block; }
    h1, h2 { color: #ffffff; text-align: center; }
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .card {
      background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px;
      text-align: center; cursor: pointer; transition: all 0.3s ease;
      display: flex; justify-content: center; align-items: center;
    }
    .card:hover { background-color: #007bff; color: white; transform: translateY(-5px); }
    .card.watched::after {
        content: '✔'; color: #007bff; font-weight: bold;
        margin-right: 10px; font-size: 1.2em;
    }
    .video-container {
      max-width: 960px; margin: 20px auto; background-color: #1e1e1e;
      border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .video-js { border-radius: 8px; overflow: hidden; }
    .back-button {
        display: block; width: fit-content; margin: 20px auto 0; padding: 10px 25px;
        border: none; border-radius: 5px; background-color: #007bff; color: white;
        cursor: pointer; transition: background-color 0.3s ease;
    }
    .back-button:hover { background-color: #0056b3; }
    .vjs-control-bar { background-color: rgba(28, 28, 28, 0.85) !important; }
    .manual-menu-button {
        position: relative; cursor: pointer; width: 5em; height: 100%;
        display: flex; align-items: center; justify-content: center; font-size: 1.1em;
    }
    .manual-menu {
        display: none; position: absolute; bottom: 100%; left: 0; right: 0;
        margin: 0 auto 10px; background-color: rgba(28, 28, 28, 0.95);
        color: white; list-style: none; padding: 5px 0; border-radius: 5px;
        min-width: 80px; text-align: center;
    }
    .manual-menu-button:hover .manual-menu { display: block; }
    .manual-menu-item { padding: 8px 12px; }
    .manual-menu-item:hover { background-color: #007bff !important; }
    .video-title-container {
        display: flex; justify-content: space-between; align-items: center; margin-top: 15px;
    }
    .video-nav-button {
        background: none; border: 2px solid #007bff; color: #007bff;
        padding: 8px 15px; border-radius: 5px; cursor: pointer;
        font-size: 1em; transition: all 0.2s ease;
    }
    .video-nav-button:hover { background-color: #007bff; color: white; }
    .video-nav-button:disabled {
        border-color: #333; color: #333; cursor: not-allowed;
    }
  </style>
</head>
<body>
  
  <div id="login-overlay">
    <div id="login-box">
      <h2>الرجاء إدخال كلمة المرور</h2>
      <input type="password" id="passwordInput" placeholder="كلمة المرور">
      <br>
      <button id="loginBtn">دخول</button>
      <p id="loginError" style="color:red; display:none;">كلمة المرور غير صحيحة</p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <div id="mainPage" class="page"><h1 >منصة السادس</h1><div class="card-grid" id="teachers"></div></div>
    <div id="teacherPage" class="page"><h2 id="teacherName"></h2><div class="card-grid" id="classes"></div><button class="back-button">العودة للرئيسية</button></div>
    <div id="classPage" class="page"><h2 id="className"></h2><div class="card-grid" id="lectures"></div><button class="back-button">العودة للمدرس</button></div>
    <div id="videoPage" class="page">
      <div class="video-container">
        <video id="videoPlayer" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
        <div class="video-title-container">
            <button id="prevLectureBtn" class="video-nav-button">السابق</button>
            <h2 id="videoTitle"></h2>
            <button id="nextLectureBtn" class="video-nav-button">التالي</button>
        </div>
        <p id="videoDescription"></p>
        <button class="back-button">العودة للفصل</button>
      </div>
    </div>
  </div>

  <script>
    let data, currentTeacher, currentClass, currentLecture, player;
    let availableQualities = [];
    let progressInterval;

    const Storage = {
        getProgress: () => JSON.parse(localStorage.getItem('videoProgress') || '{}'),
        saveProgress: (id, time) => {
            const progress = Storage.getProgress();
            progress[id] = time;
            localStorage.setItem('videoProgress', JSON.stringify(progress));
        },
        getWatched: () => JSON.parse(localStorage.getItem('watchedVideos') || '{}'),
        markAsWatched: (id) => {
            const watched = Storage.getWatched();
            watched[id] = true;
            localStorage.setItem('watchedVideos', JSON.stringify(watched));
            if(currentClass) showLectures(currentClass);
        }
    };

    // ⭐ تم إصلاح هذا الجزء بالكامل
    document.addEventListener('DOMContentLoaded', () => {
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('passwordInput');
        
        loginBtn.addEventListener('click', attemptLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });
    });

    async function attemptLogin() {
        const password = document.getElementById('passwordInput').value;
        const loginError = document.getElementById('loginError');
        loginError.style.display = 'none';
        if (!password) return;

        try {
            const response = await fetch('data.txt');
            if (!response.ok) throw new Error("File not found (data.txt)");
            const encryptedData = await response.text();
            
            const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, password);
            const decryptedJson = decryptedBytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedJson) throw new Error("Wrong password");
            
            data = JSON.parse(decryptedJson);

            const loginOverlay = document.getElementById('login-overlay');
            loginOverlay.style.opacity = '0';
            setTimeout(() => { loginOverlay.style.display = 'none'; }, 500);
            
            document.getElementById('app-content').classList.remove('hidden');
            initializeApp();
        } catch (err) {
            console.error("Login/Decryption Error:", err);
            loginError.style.display = 'block';
        }
    }
    
    function initializeApp() {
        initializePlayer();
        setupEventListeners();
        setupKeyboardShortcuts();
        navigate('main');
    }

    function setupEventListeners() {
        document.querySelector('#teacherPage .back-button').onclick = () => navigate('main');
        document.querySelector('#classPage .back-button').onclick = () => navigate('teacher');
        document.querySelector('#videoPage .back-button').onclick = () => navigate('class');
    }

    function navigate(page) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById(page + "Page").classList.add("active");
        if (page !== 'video' && player && !player.isDisposed()) player.pause();
        switch(page) {
            case 'main': showTeachers(); break;
            case 'teacher': if (currentTeacher) showClasses(currentTeacher); break;
            case 'class': if (currentClass) showLectures(currentClass); break;
            case 'video': if (currentLecture) showVideo(currentLecture); break;
        }
    }

    function createCard(text, isWatched) {
        const div = document.createElement("div");
        div.className = "card";
        if (isWatched) div.classList.add('watched');
        div.textContent = text;
        return div;
    }
    
    function showTeachers() {
        const c = document.getElementById("teachers"); c.innerHTML = "";
        data.teachers.forEach(t => {
            const card = createCard(t.name);
            card.onclick = () => { currentTeacher = t; navigate('teacher'); };
            c.appendChild(card);
        });
    }

    function showClasses(t) {
        document.getElementById("teacherName").textContent = t.name;
        const c = document.getElementById("classes"); c.innerHTML = "";
        t.classes.forEach(cls => {
            const card = createCard(cls.name);
            card.onclick = () => { currentClass = cls; navigate('class'); };
            c.appendChild(card);
        });
    }

    function showLectures(cls) {
        document.getElementById("className").textContent = cls.name;
        const c = document.getElementById("lectures"); c.innerHTML = "";
        const watchedVideos = Storage.getWatched();
        cls.lectures.forEach(lec => {
            const videoId = `${currentTeacher.name}-${cls.name}-${lec.title}`;
            const card = createCard(lec.title, watchedVideos[videoId]);
            card.onclick = () => { currentLecture = lec; navigate('video'); };
            c.appendChild(card);
        });
    }

    function initializePlayer() {
        player = videojs('videoPlayer', {
            controls: true, fluid: true,
            controlBar: {
                children: [
                    'playToggle', 'volumePanel', 'currentTimeDisplay',
                    'timeDivider', 'durationDisplay', 'progressControl',
                    'liveDisplay', 'remainingTimeDisplay', 'fullscreenToggle',
                ]
            }
        });

        player.ready(() => {
            const controlBar = player.controlBar.el(), fullscreenToggle = player.controlBar.fullscreenToggle.el();
            const speedButton = document.createElement('div');
            speedButton.className = 'manual-menu-button';
            const speedLabel = document.createElement('span');
            speedLabel.textContent = '1.0x';
            const speedMenu = document.createElement('ul');
            speedMenu.className = 'manual-menu';
            [3, 2.75, 2.5, 1, 1.25, 1.5, 1.75, 2].forEach(rate => {
                const item = document.createElement('li');
                item.className = 'manual-menu-item'; item.textContent = `${rate}x`;
                item.onclick = (e) => { e.stopPropagation(); player.playbackRate(rate); };
                speedMenu.appendChild(item);
            });
            speedButton.appendChild(speedLabel); speedButton.appendChild(speedMenu);
            controlBar.insertBefore(speedButton, fullscreenToggle);
            player.on('ratechange', () => { speedLabel.textContent = `${player.playbackRate()}x`; });

            const qualityButton = document.createElement('div');
            qualityButton.className = 'manual-menu-button';
            qualityButton.innerHTML = `<span>⚙️</span>`;
            const qualityMenu = document.createElement('ul');
            qualityMenu.className = 'manual-menu';
            qualityButton.appendChild(qualityMenu);
            controlBar.insertBefore(qualityButton, fullscreenToggle);
            
            player.on('loadstart', () => {
                qualityMenu.innerHTML = '';
                availableQualities.forEach(quality => {
                    const item = document.createElement('li');
                    item.className = 'manual-menu-item'; item.textContent = quality.label;
                    item.onclick = (e) => {
                        e.stopPropagation();
                        const time = player.currentTime(), paused = player.paused();
                        player.src({ src: quality.url, type: quality.type });
                        player.one('loadedmetadata', () => { player.currentTime(time); if (!paused) player.play(); });
                    };
                    qualityMenu.appendChild(item);
                });
            });
        });
    }

    function showVideo(lec) {
        document.getElementById("videoTitle").textContent = lec.title;
        document.getElementById("videoDescription").textContent = lec.description || "";
        updateAvailableQualities(lec.url);
        
        const videoId = `${currentTeacher.name}-${currentClass.name}-${lec.title}`;
        const lectureIndex = currentClass.lectures.findIndex(l => l.title === lec.title);

        if (progressInterval) clearInterval(progressInterval);
        
        const initialQuality = availableQualities.find(q => q.isInitial) || availableQualities[0];
        player.src({ src: initialQuality.url, type: initialQuality.type });
        
        // ⭐ تم إصلاح توقيت استرجاع التقدم
        player.one('loadedmetadata', () => {
            const savedTime = Storage.getProgress()[videoId];
            // تأكد من أن الوقت المحفوظ صالح قبل القفز إليه
            if (savedTime && savedTime > 0 && savedTime < player.duration() - 1) {
                player.currentTime(savedTime);
            }
            player.play();
        });

        player.playbackRate(1);

        progressInterval = setInterval(() => {
            if (!player.paused() && player.currentTime() > 0) {
                 Storage.saveProgress(videoId, player.currentTime());
            }
        }, 5000);

        const nextLectureBtn = document.getElementById('nextLectureBtn');
        const prevLectureBtn = document.getElementById('prevLectureBtn');
        prevLectureBtn.disabled = lectureIndex === 0;
        nextLectureBtn.disabled = lectureIndex === currentClass.lectures.length - 1;

        const goToNextLecture = () => {
            if (lectureIndex < currentClass.lectures.length - 1) {
                currentLecture = currentClass.lectures[lectureIndex + 1];
                showVideo(currentLecture);
            }
        };
        prevLectureBtn.onclick = () => {
            currentLecture = currentClass.lectures[lectureIndex - 1];
            showVideo(currentLecture);
        };
        nextLectureBtn.onclick = goToNextLecture;
        
        player.off('ended');
        player.on('ended', () => {
            Storage.markAsWatched(videoId);
            goToNextLecture();
        });
    }

    function updateAvailableQualities(url) {
        availableQualities = [];
        const mp4Pattern = /_(\d{3,4}p)\.mp4$/;
        const mediaPattern = /media-(\d+)\/stream\.m3u8$/;
        if (mp4Pattern.test(url)) {
            const baseUrl = url.replace(mp4Pattern, ""), originalQuality = url.match(mp4Pattern)[1];
            let qOptions = [];
            if (originalQuality === '1080p') qOptions = ['1080p', '720p', '360p'];
            else if (originalQuality === '720p') qOptions = ['720p', '360p'];
            else qOptions = ['360p'];
            qOptions.forEach(q => availableQualities.push({ label: q, url: `${baseUrl}_${q}.mp4`, type: 'video/mp4', isInitial: q === originalQuality }));
        } else if (mediaPattern.test(url)) {
            const currentNum = parseInt(url.match(mediaPattern)[1]), baseUrl = url.replace(/media-\d+\/stream\.m3u8$/, "");
            for (let i = 1; i <= 5; i++) availableQualities.push({ label: `الجودة ${i}`, url: `${baseUrl}media-${i}/stream.m3u8`, type: "application/x-mpegURL", isInitial: i === currentNum });
        } else {
            availableQualities.push({ label: "Auto", url, type: url.endsWith('.m3u8') ? "application/x-mpegURL" : "video/mp4", isInitial: true });
        }
    }
    
    function setupKeyboardShortcuts() {
        document.addEventListener('keydown', e => {
            if (!document.getElementById('videoPage').classList.contains('active')) return;
            const activeEl = document.activeElement;
            if (['INPUT', 'SELECT', 'BUTTON'].includes(activeEl.tagName) || activeEl.isContentEditable) return;
            switch(e.key.toLowerCase()) {
                case ' ': e.preventDefault(); player.paused() ? player.play() : player.pause(); break;
                case 'd': case 'arrowright': e.preventDefault(); player.currentTime(player.currentTime() + 10); break;
                case 'a': case 'arrowleft': e.preventDefault(); player.currentTime(player.currentTime() - 10); break;
            }
        });
    }
  </script>
</body>
</html>
